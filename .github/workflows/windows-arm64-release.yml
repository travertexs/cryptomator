name: Build and release Windows ARM64

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git tag for the downstream ARM64 release
        required: true
        default: windows-arm64-1.20.0-preview.3
      app_version:
        description: Version shown by Cryptomator
        required: true
        default: 1.20.0-arm64-preview.3
      package_version:
        description: Numeric Windows package version
        required: true
        default: 1.20.0.3
      runtime_run_id:
        description: Optional prior Actions run with an identical successfully built runtime
        required: false
        default: ''
  push:
    branches:
      - develop

permissions:
  contents: write
  actions: read

concurrency:
  group: windows-arm64-release
  cancel-in-progress: false

env:
  APP_VERSION: ${{ inputs.app_version || '1.20.0-arm64-preview.3' }}
  PACKAGE_VERSION: ${{ inputs.package_version || '1.20.0.3' }}
  RELEASE_TAG: ${{ inputs.release_tag || 'windows-arm64-1.20.0-preview.3' }}
  ASSET_NAME: Cryptomator-${{ inputs.app_version || '1.20.0-arm64-preview.3' }}-windows-arm64.zip

jobs:
  build-runtime:
    name: Build patched ARM64 OpenJDK runtime
    if: (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[arm64-release]')) && !inputs.runtime_run_id
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      MSYS2_PATH_TYPE: minimal
      CHERE_INVOKING: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check out pinned OpenJDK source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: openjdk/jdk26u
          ref: d55edf1cba61219d17565da51cd13a4d425f7c59 # jdk-26.0.2.1-ga
          path: .arm64/jdk-source
      - name: Set up boot JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
      - name: Set up OpenJDK build shell
        uses: ./.arm64/jdk-source/.github/actions/get-msys2
      - name: Apply ARM64 first-chance exception fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('hotspot-hello-exceptions.patch', 'openjdk-msys2-make.patch')) {
            $patch = Join-Path $env:GITHUB_WORKSPACE "dist/win/arm64/$name"
            # OpenJDK disables line-ending conversion; this repository does not.
            [IO.File]::WriteAllText($patch, [IO.File]::ReadAllText($patch).Replace("`r`n", "`n"), [Text.UTF8Encoding]::new($false))
            git -C .arm64/jdk-source apply --check $patch
            if ($LASTEXITCODE -ne 0) { throw "OpenJDK patch no longer applies: $name" }
            git -C .arm64/jdk-source apply $patch
            if ($LASTEXITCODE -ne 0) { throw "Unable to patch OpenJDK: $name" }
          }
      - name: Configure patched OpenJDK
        working-directory: .arm64/jdk-source
        shell: msys2 {0}
        run: |
          bash configure \
            --with-conf-name=windows-aarch64-hello \
            --openjdk-target=aarch64-unknown-cygwin \
            --with-boot-jdk="$(cygpath -u "$JAVA_HOME")" \
            --with-toolchain-version=2022 \
            --with-msvc-toolset-version=14.44 \
            --with-debug-level=release \
            --with-version-opt=cryptomator-arm64-preview3 \
            --with-jmod-compress=zip-1 \
            --with-native-debug-symbols=none \
            --with-vendor-name=Cryptomator-ARM64-Downstream \
            --with-vendor-url=https://github.com/travertexs/cryptomator \
            --with-vendor-bug-url=https://github.com/travertexs/cryptomator/issues
      - name: Compile complete ARM64 JDK image
        working-directory: .arm64/jdk-source
        shell: msys2 {0}
        run: make CONF=windows-aarch64-hello images
      - name: Package runtime and corresponding patched source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory .arm64/runtime-build -Force | Out-Null
          Compress-Archive -Path .arm64/jdk-source/build/windows-aarch64-hello/images/jdk/* -DestinationPath .arm64/runtime-build/openjdk-arm64.zip
          git -C .arm64/jdk-source add src/hotspot/os/windows/os_windows.cpp make/autoconf/basic_tools.m4
          $tree = (git -C .arm64/jdk-source write-tree).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Unable to record patched OpenJDK source.' }
          $sourceZip = Join-Path $env:GITHUB_WORKSPACE '.arm64/runtime-build/OpenJDK-26.0.2.1-arm64-preview.3-source.zip'
          git -C .arm64/jdk-source archive --format=zip --prefix=openjdk-26.0.2.1-arm64-preview.3/ --output=$sourceZip $tree
          if ($LASTEXITCODE -ne 0) { throw 'Unable to archive corresponding OpenJDK source.' }
      - name: Upload patched runtime and source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patched-openjdk-arm64
          path: .arm64/runtime-build/*.zip
          if-no-files-found: error

      - name: Preserve runtime build diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openjdk-build-diagnostics
          include-hidden-files: true
          path: |
            .arm64/jdk-source/build/*/configure.log
            .arm64/jdk-source/build/*/config.log
            .arm64/jdk-source/build/*/make-support/failure-summary
            .arm64/jdk-source/config.log
          if-no-files-found: ignore

  build-and-release:
    name: Native Windows ARM64 application
    needs: build-runtime
    if: always() && !cancelled() && (needs.build-runtime.result == 'success' || (needs.build-runtime.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.runtime_run_id != ''))
    runs-on: windows-11-arm
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve Windows integration version
        id: integrations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pom = Get-Content -LiteralPath pom.xml -Raw
          if ($pom -notmatch '<cryptomator\.integrations\.win\.version>([^<]+)</cryptomator\.integrations\.win\.version>') {
            throw 'Unable to resolve the integrations-win version from pom.xml.'
          }
          "version=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check out matching Windows integration source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: cryptomator/integrations-win
          ref: ${{ steps.integrations.outputs.version }}
          path: .arm64/integrations-win
          fetch-depth: 1

      - name: Set up Liberica JDK with JavaFX
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: liberica
          java-version: '26'
          java-package: jdk+fx
          architecture: aarch64
          cache: maven
          check-latest: true

      - name: Verify ARM64 build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $architecture = (& "$env:JAVA_HOME\bin\java.exe" -XshowSettings:properties -version 2>&1 |
            Select-String 'os.arch =').ToString()
          if ($architecture -notmatch 'aarch64') {
            throw "Expected an aarch64 JDK, got: $architecture"
          }

          @('javafx.base.jmod', 'javafx.controls.jmod', 'javafx.fxml.jmod', 'javafx.graphics.jmod') |
            ForEach-Object {
              $jmod = Join-Path "$env:JAVA_HOME\jmods" $_
              if (-not (Test-Path -LiteralPath $jmod)) {
                throw "Missing JavaFX jmod: $jmod"
              }
            }

      - name: Verify reusable runtime provenance
        if: inputs.runtime_run_id != '' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNTIME_RUN_ID -notmatch '^[0-9]+$') { throw 'Invalid runtime run ID.' }
          function Read-GitHub([string]$endpoint) {
            $json = & gh api $endpoint
            if ($LASTEXITCODE -ne 0) { throw "GitHub lookup failed: $endpoint" }
            $json | ConvertFrom-Json
          }
          $run = Read-GitHub "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RUNTIME_RUN_ID"
          if ($run.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or $run.head_branch -ne 'develop' -or $run.event -notin @('push', 'workflow_dispatch')) {
            throw 'Runtime must come from a trusted develop build in this fork.'
          }
          $jobs = Read-GitHub "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RUNTIME_RUN_ID/jobs?per_page=100"
          if (-not ($jobs.jobs | Where-Object { $_.name -eq 'Build patched ARM64 OpenJDK runtime' -and $_.conclusion -eq 'success' })) {
            throw 'The referenced runtime build did not succeed.'
          }
          foreach ($path in @('dist/win/arm64/hotspot-hello-exceptions.patch', 'dist/win/arm64/openjdk-msys2-make.patch')) {
            $previous = Read-GitHub "repos/$env:GITHUB_REPOSITORY/contents/${path}?ref=$($run.head_sha)"
            $current = (& git rev-parse "HEAD:$path").Trim()
            if ($LASTEXITCODE -ne 0 -or $current -ne $previous.sha) { throw "Runtime patch changed: $path" }
          }
          $oldWorkflow = Read-GitHub "repos/$env:GITHUB_REPOSITORY/contents/.github/workflows/windows-arm64-release.yml?ref=$($run.head_sha)"
          $oldText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($oldWorkflow.content))
          $newText = Get-Content -LiteralPath .github/workflows/windows-arm64-release.yml -Raw
          function Runtime-Configuration([string]$text) {
            $match = [regex]::Match($text.Replace("`r`n", "`n"), '(?ms)^  build-runtime:\n(?<job>.*?)^  build-and-release:')
            if (-not $match.Success) { throw 'Cannot identify runtime build configuration.' }
            [regex]::Replace($match.Groups['job'].Value, '(?m)^    if:.*\n', '').Trim()
          }
          if ((Runtime-Configuration $oldText) -cne (Runtime-Configuration $newText)) {
            throw 'Runtime build settings changed; build a fresh runtime instead.'
          }
          Write-Host "Verified unchanged runtime patches and build settings from run $env:RUNTIME_RUN_ID, commit $($run.head_sha)."

      - name: Download patched ARM64 runtime
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: patched-openjdk-arm64
          path: .arm64/runtime-build
          run-id: ${{ inputs.runtime_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Activate patched runtime with ARM64 JavaFX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jdk = Join-Path $env:GITHUB_WORKSPACE '.arm64/patched-jdk'
          Expand-Archive -LiteralPath .arm64/runtime-build/openjdk-arm64.zip -DestinationPath $jdk
          Get-ChildItem -LiteralPath "$env:JAVA_HOME/jmods" -Filter 'javafx*.jmod' | Copy-Item -Destination "$jdk/jmods"
          & "$jdk/bin/java.exe" -version
          if ($LASTEXITCODE -ne 0) { throw 'Patched ARM64 runtime did not start.' }
          "JAVA_HOME=$jdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$jdk/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build ARM64 integration with Windows Hello thread isolation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $integrationSource = Join-Path $env:GITHUB_WORKSPACE '.arm64\integrations-win'
          $patch = Join-Path $env:GITHUB_WORKSPACE 'dist\win\arm64\windows-hello-threading.patch'

          & git -C $integrationSource apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'The Windows Hello patch no longer applies to integrations-win.' }
          & git -C $integrationSource apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'Unable to apply the Windows Hello patch.' }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe is unavailable.' }
          $vsPath = (& $vswhere -latest -products * -property installationPath).Trim()
          if (-not $vsPath) { throw 'Visual Studio was not found.' }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvarsarm64.bat'
          if (-not (Test-Path -LiteralPath $vcvars)) { throw "ARM64 compiler environment is unavailable: $vcvars" }

          New-Item -ItemType Directory -Path (Join-Path $integrationSource 'target') -Force | Out-Null

          Push-Location $integrationSource
          try {
            $compileCommand = ('call "{0}" && make install ARCH=arm64' -f $vcvars)
            & cmd.exe /d /c $compileCommand
            if ($LASTEXITCODE -ne 0) { throw 'Unable to compile the patched ARM64 integration.' }
          } finally {
            Pop-Location
          }

          $dll = Join-Path $integrationSource 'src\main\resources\integrations-arm64.dll'
          if (-not (Test-Path -LiteralPath $dll)) { throw 'The patched ARM64 integration DLL was not produced.' }

      - name: Verify handled and fatal native exceptions under JNI
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = (& $vswhere -latest -products * -property installationPath).Trim()
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvarsarm64.bat'
          New-Item -ItemType Directory .arm64/probe -Force | Out-Null
          $compile = ('call "{0}" && cl /LD /I"{1}\include" /I"{1}\include\win32" dist\win\arm64\hotspot-exception-probe.cpp /Fo:.arm64\probe\exceptions.obj /link /OUT:.arm64\probe\exceptions.dll' -f $vcvars, $env:JAVA_HOME)
          & cmd.exe /d /c $compile
          if ($LASTEXITCODE -ne 0) { throw 'Exception regression DLL compilation failed.' }
          & "$env:JAVA_HOME/bin/javac.exe" -d .arm64/probe dist/win/arm64/HotspotExceptionProbe.java
          if ($LASTEXITCODE -ne 0) { throw 'Exception regression Java compilation failed.' }
          $dll = (Resolve-Path .arm64/probe/exceptions.dll).Path
          & "$env:JAVA_HOME/bin/java.exe" --enable-native-access=ALL-UNNAMED -Xcheck:jni -cp .arm64/probe HotspotExceptionProbe $dll handled
          if ($LASTEXITCODE -ne 0) { throw 'Handled Windows cryptography exception killed the JVM.' }
          foreach ($mode in @('unhandled', 'access-violation')) {
            $log = Join-Path $env:GITHUB_WORKSPACE ".arm64/probe/$mode-fatal.log"
            & "$env:JAVA_HOME/bin/java.exe" --enable-native-access=ALL-UNNAMED "-XX:ErrorFile=$log" -cp .arm64/probe HotspotExceptionProbe $dll $mode
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) { throw "The runtime incorrectly swallowed $mode." }
            $exitHex = '{0:X8}' -f ($exitCode -band 0xFFFFFFFFL)
            $expected = if ($mode -eq 'unhandled') { '0x80090016' } else { 'EXCEPTION_ACCESS_VIOLATION' }
            $expectedExit = if ($mode -eq 'unhandled') { '80090016' } else { 'C0000005' }
            $hasDiagnostic = (Test-Path -LiteralPath $log) -and [bool](Select-String -LiteralPath $log -SimpleMatch $expected)
            # Windows can terminate with the original SEH code before HotSpot
            # writes an hs_err log. Accept that exact fatal code, not any failure.
            if (-not $hasDiagnostic -and $exitHex -ne $expectedExit) {
              throw "Unexpected exit for ${mode}: 0x$exitHex, without the expected diagnostic."
            }
            Write-Host "${mode}: fatal exit 0x$exitHex; expected HotSpot diagnostic: $hasDiagnostic"
          }
          Write-Host 'Handled native errors survive; unhandled and access-violation errors remain fatal.'
          exit 0

      - name: Test Windows Hello native threading and JNI failures
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $integrationSource = Join-Path $env:GITHUB_WORKSPACE '.arm64\integrations-win'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = (& $vswhere -latest -products * -property installationPath).Trim()
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvarsarm64.bat'
          Copy-Item -LiteralPath dist\win\arm64\windows-hello-threading-test.cpp -Destination $integrationSource
          Push-Location $integrationSource
          try {
            $compile = ('call "{0}" && cl /EHsc /std:c++20 /W4 /I"src\main\headers" /I"{1}\include" /I"{1}\include\win32" windows-hello-threading-test.cpp /Fe:target\hello-threading-test.exe /Fo:target\hello-threading-test.obj /link crypt32.lib shell32.lib ole32.lib uuid.lib user32.lib Advapi32.lib windowsapp.lib' -f $vcvars, $env:JAVA_HOME)
            & cmd.exe /d /c $compile
            if ($LASTEXITCODE -ne 0) { throw 'Native regression probe compilation failed.' }
            & .\target\hello-threading-test.exe
            if ($LASTEXITCODE -ne 0) { throw 'Native Windows Hello regression probe failed.' }
          } finally {
            Pop-Location
          }
          & "$env:JAVA_HOME\bin\javac.exe" -d .arm64\probe dist\win\arm64\WindowsHello.java
          if ($LASTEXITCODE -ne 0) { throw 'JNI regression probe compilation failed.' }
          $dll = Join-Path $integrationSource 'src\main\resources\integrations-arm64.dll'
          & "$env:JAVA_HOME\bin\java.exe" --enable-native-access=ALL-UNNAMED -Xcheck:jni -cp .arm64\probe org.cryptomator.windows.keychain.WindowsHello $dll
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Filter 'hs_err_pid*.log' |
              ForEach-Object { Get-Content -LiteralPath $_.FullName -TotalCount 160 }
            throw 'Windows Hello JNI regression probe failed.'
          }

      - name: Compile application with Maven Wrapper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\mvnw.cmd -B versions:set "-DnewVersion=$env:APP_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to set the application version.' }

          # Maven Central has no Windows ARM64 JavaFX classifier. These jars are
          # compile-only here and excluded from target/mods; ARM64 JavaFX comes
          # from the verified Liberica jmods used by jlink below.
          & .\mvnw.cmd -B clean package -Pwin "-Djavafx.platform=win" -DskipTests
          if ($LASTEXITCODE -ne 0) { throw 'Maven package failed.' }

          Copy-Item -LiteralPath LICENSE.txt -Destination target
          Get-ChildItem -LiteralPath target -Filter 'cryptomator-*.jar' |
            Copy-Item -Destination target\mods

      - name: Inject patched ARM64 integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $integrationJar = Get-ChildItem -LiteralPath target\mods -Filter 'integrations-win-*.jar' |
            Select-Object -First 1
          if ($null -eq $integrationJar) { throw 'integrations-win module is missing from target/mods.' }

          $dllDir = Join-Path $env:GITHUB_WORKSPACE '.arm64\integrations-win\src\main\resources'
          & "$env:JAVA_HOME\bin\jar.exe" --update --file $integrationJar.FullName -C $dllDir integrations-arm64.dll
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inject the patched ARM64 integration DLL.' }

      - name: Create native ARM64 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modules = @(
            'java.base', 'java.desktop', 'java.instrument', 'java.logging',
            'java.naming', 'java.net.http', 'java.scripting', 'java.sql', 'java.xml',
            'javafx.base', 'javafx.graphics', 'javafx.controls', 'javafx.fxml',
            'jdk.crypto.cryptoki', 'jdk.crypto.ec', 'jdk.crypto.mscapi',
            'jdk.unsupported', 'jdk.accessibility', 'jdk.management.jfr', 'java.compiler'
          ) -join ','

          $jlinkArgs = @(
            '--verbose',
            '--output', 'runtime',
            '--module-path', "$env:JAVA_HOME\jmods",
            '--add-modules', $modules,
            '--strip-native-commands',
            '--no-header-files',
            '--no-man-pages',
            '--strip-debug',
            '--compress', 'zip-0'
          )
          & "$env:JAVA_HOME\bin\jlink.exe" @jlinkArgs
          if ($LASTEXITCODE -ne 0) { throw 'jlink failed.' }

      - name: Create native ARM64 application image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jpackageArgs = @(
            '--verbose',
            '--type', 'app-image',
            '--runtime-image', 'runtime',
            '--input', 'target/libs',
            '--module-path', 'target/mods',
            '--module', 'org.cryptomator.desktop/org.cryptomator.launcher.Cryptomator',
            '--dest', 'appdir',
            '--name', 'Cryptomator',
            '--vendor', 'Skymatic GmbH',
            '--copyright', '(C) 2016 - 2026 Skymatic GmbH',
            '--app-version', "$env:PACKAGE_VERSION",
            '--java-options', '--enable-preview',
            '--java-options', '--enable-native-access=javafx.graphics,org.cryptomator.jfuse.win,org.cryptomator.integrations.win',
            '--java-options', '-Xss5m',
            '--java-options', '-Xmx256m',
            '--java-options', "-Dcryptomator.appVersion=$env:APP_VERSION",
            '--java-options', '-Dfile.encoding=utf-8',
            '--java-options', '-Djava.net.useSystemProxies=true',
            '--java-options', '-Dcryptomator.adminConfigPath=C:/ProgramData/Cryptomator/config.properties',
            '--java-options', '-Dcryptomator.logDir=@{localappdata}/Cryptomator',
            '--java-options', '-Dcryptomator.settingsPath=@{appdata}/Cryptomator/settings.json;@{userhome}/AppData/Roaming/Cryptomator/settings.json',
            '--java-options', '-Dcryptomator.p12Path=@{appdata}/Cryptomator/key.p12;@{userhome}/AppData/Roaming/Cryptomator/key.p12',
            '--java-options', '-Dcryptomator.ipcSocketPath=@{localappdata}/Cryptomator/ipc.socket',
            '--java-options', '-Dcryptomator.mountPointsDir=@{userhome}/Cryptomator',
            '--java-options', '-Dcryptomator.loopbackAlias=cryptomator-vault',
            '--java-options', '-Dcryptomator.showTrayIcon=true',
            '--java-options', "-Dcryptomator.buildNumber=windows-arm64-$env:GITHUB_RUN_NUMBER",
            '--java-options', '-Dcryptomator.integrationsWin.autoStartShellLinkName=Cryptomator',
            '--java-options', '-Dcryptomator.integrationsWin.keychainPaths=@{appdata}/Cryptomator/keychain.json;@{userhome}/AppData/Roaming/Cryptomator/keychain.json',
            '--java-options', '-Dcryptomator.integrationsWin.windowsHelloKeychainPaths=@{appdata}/Cryptomator/windowsHelloKeychain.json',
            '--java-options', '-Dcryptomator.disableUpdateCheck=true',
            '--java-options', '-XX:ErrorFile=@{localappdata}/Cryptomator/cryptomator_crash.log',
            '--java-options', '-Dcryptomator.hub.enableTrustOnFirstUse=true',
            '--resource-dir', 'dist/win/resources',
            '--icon', 'dist/win/resources/Cryptomator.ico',
            '--add-launcher', 'Cryptomator (Debug)=dist/win/debug-launcher.properties'
          )
          & "$env:JAVA_HOME\bin\jpackage.exe" @jpackageArgs
          if ($LASTEXITCODE -ne 0) { throw 'jpackage failed.' }

          # The upstream contrib copy contains an x64-only legacy jnidispatch.dll.
          # The current app no longer needs that loose DLL, so keep it out of the ARM64 image.
          Get-ChildItem -LiteralPath dist\win\contrib -File |
            Where-Object Name -NE 'jnidispatch.dll' |
            Copy-Item -Destination appdir\Cryptomator

          @"
          Cryptomator Windows ARM64 downstream preview

          This is an unofficial, unsigned ARM64 build from:
          https://github.com/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA

          Optional: Install WinFsp 2.1 or newer to use the WinFsp volume type:
          https://github.com/winfsp/winfsp/releases

          Start Cryptomator.exe from this directory. Automatic in-app updates are
          disabled because official updates currently provide x64 Windows packages.
          Windows Hello runs on a dedicated background COM thread. Existing Hello
          keys and saved-password format are preserved. PIN/biometric authentication
          still requires validation on an enrolled Windows ARM64 device.

          The bundled OpenJDK runtime includes a narrow ARM64 first-chance exception
          fix. Its complete modified source is attached to the same GitHub release.
          The runtime is a downstream OpenJDK build, not an official Liberica build.
          "@ | Set-Content -LiteralPath appdir\Cryptomator\README-WINDOWS-ARM64.txt -Encoding utf8

      - name: Verify native binaries and ARM64 integration resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-PeMachine([string] $Path) {
            $stream = [IO.File]::OpenRead($Path)
            try {
              $reader = [IO.BinaryReader]::new($stream)
              $stream.Position = 0x3c
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) {
                throw "Not a PE file: $Path"
              }
              return $reader.ReadUInt16()
            } finally {
              $stream.Dispose()
            }
          }

          $arm64 = 0xAA64
          $files = @(
            'appdir\Cryptomator\Cryptomator.exe',
            'appdir\Cryptomator\Cryptomator (Debug).exe'
          )
          foreach ($name in @('jvm.dll', 'glass.dll', 'prism_d3d.dll')) {
            $match = Get-ChildItem -LiteralPath appdir\Cryptomator\runtime -Recurse -File -Filter $name |
              Select-Object -First 1
            if ($null -eq $match) { throw "Missing runtime binary: $name" }
            $files += $match.FullName
          }

          foreach ($file in $files) {
            $machine = Get-PeMachine $file
            if ($machine -ne $arm64) {
              throw ('Expected ARM64 PE machine 0xAA64 for {0}; got 0x{1:X4}.' -f $file, $machine)
            }
            Write-Host ('Verified ARM64: {0}' -f $file)
          }

          if (Test-Path -LiteralPath appdir\Cryptomator\jnidispatch.dll) {
            throw 'The x64-only loose jnidispatch.dll must not be present in the ARM64 image.'
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $integrationJar = Get-ChildItem -LiteralPath appdir\Cryptomator\app\mods -Filter 'integrations-win-*.jar' |
            Select-Object -First 1
          if ($null -eq $integrationJar) { throw 'integrations-win module is missing.' }
          $archive = [IO.Compression.ZipFile]::OpenRead($integrationJar.FullName)
          try {
            $entry = $archive.GetEntry('integrations-arm64.dll')
            if ($null -eq $entry) {
              throw 'integrations-win does not contain integrations-arm64.dll.'
            }
            $patchedIntegration = Join-Path $env:RUNNER_TEMP 'cryptomator-integrations-arm64.dll'
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $patchedIntegration, $true)
          } finally {
            $archive.Dispose()
          }

          $machine = Get-PeMachine $patchedIntegration
          if ($machine -ne $arm64) {
            throw ('Expected ARM64 PE machine 0xAA64 for the Windows integration; got 0x{0:X4}.' -f $machine)
          }
          Write-Host 'Verified patched Windows Hello integration is ARM64.'

      - name: Launch smoke test with Windows Hello selected
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path 'appdir\Cryptomator\Cryptomator (Debug).exe'
          $smokeDir = Join-Path $env:RUNNER_TEMP 'cryptomator-hello-selected'
          New-Item -ItemType Directory -Path $smokeDir -Force | Out-Null
          @{ useKeychain = $true; keychainProvider = 'org.cryptomator.windows.keychain.WindowsHelloKeychainAccess'; directories = @() } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $smokeDir 'settings.json') -Encoding utf8
          $cfg = 'appdir\Cryptomator\app\Cryptomator (Debug).cfg'
          $originalCfg = Get-Content -LiteralPath $cfg -Raw
          $smokePath = $smokeDir.Replace('\', '/')
          $testOptions = @(
            "java-options=-Dcryptomator.settingsPath=$smokePath/settings.json",
            "java-options=-Dcryptomator.logDir=$smokePath",
            "java-options=-Dcryptomator.ipcSocketPath=$smokePath/ipc.socket",
            "java-options=-Dcryptomator.integrationsWin.windowsHelloKeychainPaths=$smokePath/windowsHelloKeychain.json",
            "java-options=-Dcryptomator.integrationsWin.keychainPaths=$smokePath/keychain.json",
            "java-options=-XX:ErrorFile=$smokePath/hs_err_pid%p.log"
          )
          $testCfg = $originalCfg
          foreach ($option in $testOptions) {
            $prefix = $option.Substring(0, $option.LastIndexOf('='))
            $pattern = '(?m)^' + [regex]::Escape($prefix) + '=.*$'
            if (-not [regex]::IsMatch($testCfg, $pattern)) { throw "Missing smoke-test option: $prefix" }
            $testCfg = [regex]::Replace($testCfg, $pattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($match) $option })
          }
          Set-Content -LiteralPath $cfg -Value $testCfg -Encoding utf8 -NoNewline
          $process = Start-Process -FilePath $exe -WorkingDirectory 'appdir\Cryptomator' `
            -WindowStyle Hidden -RedirectStandardOutput smoke.stdout.txt -RedirectStandardError smoke.stderr.txt -PassThru
          try {
            Start-Sleep -Seconds 20
            $process.Refresh()
            if ($process.HasExited) {
              Write-Host '--- stdout ---'
              if (Test-Path smoke.stdout.txt) { Get-Content smoke.stdout.txt }
              Write-Host '--- stderr ---'
              if (Test-Path smoke.stderr.txt) { Get-Content smoke.stderr.txt }
              Get-ChildItem -LiteralPath $smokeDir -Filter 'hs_err_pid*.log' -ErrorAction SilentlyContinue |
                ForEach-Object {
                  Write-Host "--- $($_.Name) ---"
                  Get-Content -LiteralPath $_.FullName
                }
              throw "Cryptomator exited during the ARM64 smoke test with code $($process.ExitCode)."
            }
            Write-Host 'Cryptomator remained running for 20 seconds on the native ARM64 runner.'
          } finally {
            Set-Content -LiteralPath $cfg -Value $originalCfg -Encoding utf8 -NoNewline
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F
            }
          }

          $launcherConfigs = Get-ChildItem -LiteralPath appdir\Cryptomator\app -Filter '*.cfg'
          if ($launcherConfigs | Select-String -SimpleMatch 'cryptomator.keychain.disabledProviders') {
            throw 'The packaged launcher still disables a keychain provider.'
          }

      - name: Package portable release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -LiteralPath appdir\Cryptomator -DestinationPath "$env:ASSET_NAME" -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath "$env:ASSET_NAME" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:ASSET_NAME" | Set-Content -LiteralPath "$env:ASSET_NAME.sha256" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cryptomator-windows-arm64
          path: |
            ${{ env.ASSET_NAME }}
            ${{ env.ASSET_NAME }}.sha256
          if-no-files-found: error

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          @"
          Unofficial Windows ARM64 preview built entirely with GitHub Actions. The
          runtime is cross-compiled on a Windows x64 runner; the application,
          native integration and runtime regression tests run on Windows ARM64.

          Source commit: https://github.com/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA

          Validation performed by this workflow:

          - ARM64 JDK and JavaFX module checks
          - Maven packaging with the repository's Maven Wrapper
          - PE machine checks for the launchers, JVM, and JavaFX runtime
          - compilation and PE verification of the patched ARM64 Windows integration
          - handled Windows cryptography exception survives JNI
          - unhandled cryptography exception and access violation still terminate Java
          - real Windows Hello availability call through JNI with -Xcheck:jni
          - a 20-second native launch smoke test with the Windows Hello provider enabled

          The bundled OpenJDK 26.0.2.1 runtime is rebuilt from pinned upstream source
          with a narrow ARM64 exception-handling patch. Windows Hello's internally
          handled cryptography errors now reach the Windows native handlers, instead
          of immediately terminating Java. Unhandled errors remain fatal. The complete
          modified OpenJDK source is attached; build instructions are in the workflow.

          Windows Hello availability, encryption and decryption now run on a dedicated
          MTA thread. This corrects blocking WinRT calls on an STA thread and prevents
          a failed credential open from being dereferenced. The Hello key identifier
          and saved-password encryption format are unchanged.
          Native delayed-operation, error-propagation and JNI negative-input checks
          run before packaging. Startup also runs with Hello selected in temporary
          settings. GitHub's runner has no enrolled Hello identity: actual biometric
          or PIN authentication remains unverified until tested on the user's device.

          This downstream build is unsigned, so Windows may show a SmartScreen warning.
          Extract the ZIP and run `Cryptomator.exe`. WinFsp 2.1 or newer is optional
          and available from https://github.com/winfsp/winfsp/releases.

          Automatic in-app updates are disabled to prevent replacement by an official
          x64 Windows package.
          "@ | Set-Content -LiteralPath release-notes.md -Encoding utf8

          & gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw 'Release tag already exists; do not overwrite a published preview.'
          } else {
            & gh release create "$env:RELEASE_TAG" "$env:ASSET_NAME" "$env:ASSET_NAME.sha256" .arm64/runtime-build/OpenJDK-26.0.2.1-arm64-preview.3-source.zip `
              --target "$env:GITHUB_SHA" `
              --title "Cryptomator $env:APP_VERSION for Windows ARM64" `
              --notes-file release-notes.md `
              --prerelease `
              --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create the ARM64 release.' }
          }
