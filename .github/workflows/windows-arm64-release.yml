name: Build and release Windows ARM64

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git tag for the downstream ARM64 release
        required: true
        default: windows-arm64-1.20.0-preview.2
      app_version:
        description: Version shown by Cryptomator
        required: true
        default: 1.20.0-arm64-preview.2
      package_version:
        description: Numeric Windows package version
        required: true
        default: 1.20.0.2
  push:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: windows-arm64-release
  cancel-in-progress: false

env:
  APP_VERSION: ${{ inputs.app_version || '1.20.0-arm64-preview.2' }}
  PACKAGE_VERSION: ${{ inputs.package_version || '1.20.0.2' }}
  RELEASE_TAG: ${{ inputs.release_tag || 'windows-arm64-1.20.0-preview.2' }}
  ASSET_NAME: Cryptomator-${{ inputs.app_version || '1.20.0-arm64-preview.2' }}-windows-arm64.zip

jobs:
  build-and-release:
    name: Native Windows ARM64 application
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[arm64-release]')
    runs-on: windows-11-arm
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve Windows integration version
        id: integrations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pom = Get-Content -LiteralPath pom.xml -Raw
          if ($pom -notmatch '<cryptomator\.integrations\.win\.version>([^<]+)</cryptomator\.integrations\.win\.version>') {
            throw 'Unable to resolve the integrations-win version from pom.xml.'
          }
          "version=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check out matching Windows integration source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: cryptomator/integrations-win
          ref: ${{ steps.integrations.outputs.version }}
          path: .arm64/integrations-win
          fetch-depth: 1

      - name: Set up Liberica JDK with JavaFX
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: liberica
          java-version: '26'
          java-package: jdk+fx
          architecture: aarch64
          cache: maven
          check-latest: true

      - name: Verify ARM64 build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $architecture = (& "$env:JAVA_HOME\bin\java.exe" -XshowSettings:properties -version 2>&1 |
            Select-String 'os.arch =').ToString()
          if ($architecture -notmatch 'aarch64') {
            throw "Expected an aarch64 JDK, got: $architecture"
          }

          @('javafx.base.jmod', 'javafx.controls.jmod', 'javafx.fxml.jmod', 'javafx.graphics.jmod') |
            ForEach-Object {
              $jmod = Join-Path "$env:JAVA_HOME\jmods" $_
              if (-not (Test-Path -LiteralPath $jmod)) {
                throw "Missing JavaFX jmod: $jmod"
              }
            }

      - name: Build ARM64 integration with safe Windows Hello detection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $integrationSource = Join-Path $env:GITHUB_WORKSPACE '.arm64\integrations-win'
          $patch = Join-Path $env:GITHUB_WORKSPACE 'dist\win\arm64\windows-hello-availability.patch'

          & git -C $integrationSource apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'The Windows Hello patch no longer applies to integrations-win.' }
          & git -C $integrationSource apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'Unable to apply the Windows Hello patch.' }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe is unavailable.' }
          $vsPath = (& $vswhere -latest -products * -property installationPath).Trim()
          if (-not $vsPath) { throw 'Visual Studio was not found.' }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvarsarm64.bat'
          if (-not (Test-Path -LiteralPath $vcvars)) { throw "ARM64 compiler environment is unavailable: $vcvars" }

          Push-Location $integrationSource
          try {
            $compileCommand = ('call "{0}" && make install ARCH=arm64' -f $vcvars)
            & cmd.exe /d /c $compileCommand
            if ($LASTEXITCODE -ne 0) { throw 'Unable to compile the patched ARM64 integration.' }
          } finally {
            Pop-Location
          }

          $dll = Join-Path $integrationSource 'src\main\resources\integrations-arm64.dll'
          if (-not (Test-Path -LiteralPath $dll)) { throw 'The patched ARM64 integration DLL was not produced.' }

      - name: Compile application with Maven Wrapper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\mvnw.cmd -B versions:set "-DnewVersion=$env:APP_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to set the application version.' }

          # Maven Central has no Windows ARM64 JavaFX classifier. These jars are
          # compile-only here and excluded from target/mods; ARM64 JavaFX comes
          # from the verified Liberica jmods used by jlink below.
          & .\mvnw.cmd -B clean package -Pwin "-Djavafx.platform=win" -DskipTests
          if ($LASTEXITCODE -ne 0) { throw 'Maven package failed.' }

          Copy-Item -LiteralPath LICENSE.txt -Destination target
          Get-ChildItem -LiteralPath target -Filter 'cryptomator-*.jar' |
            Copy-Item -Destination target\mods

      - name: Inject patched ARM64 integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $integrationJar = Get-ChildItem -LiteralPath target\mods -Filter 'integrations-win-*.jar' |
            Select-Object -First 1
          if ($null -eq $integrationJar) { throw 'integrations-win module is missing from target/mods.' }

          $dllDir = Join-Path $env:GITHUB_WORKSPACE '.arm64\integrations-win\src\main\resources'
          & "$env:JAVA_HOME\bin\jar.exe" --update --file $integrationJar.FullName -C $dllDir integrations-arm64.dll
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inject the patched ARM64 integration DLL.' }

      - name: Create native ARM64 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modules = @(
            'java.base', 'java.desktop', 'java.instrument', 'java.logging',
            'java.naming', 'java.net.http', 'java.scripting', 'java.sql', 'java.xml',
            'javafx.base', 'javafx.graphics', 'javafx.controls', 'javafx.fxml',
            'jdk.crypto.cryptoki', 'jdk.crypto.ec', 'jdk.crypto.mscapi',
            'jdk.unsupported', 'jdk.accessibility', 'jdk.management.jfr', 'java.compiler'
          ) -join ','

          $jlinkArgs = @(
            '--verbose',
            '--output', 'runtime',
            '--module-path', "$env:JAVA_HOME\jmods",
            '--add-modules', $modules,
            '--strip-native-commands',
            '--no-header-files',
            '--no-man-pages',
            '--strip-debug',
            '--compress', 'zip-0'
          )
          & "$env:JAVA_HOME\bin\jlink.exe" @jlinkArgs
          if ($LASTEXITCODE -ne 0) { throw 'jlink failed.' }

      - name: Create native ARM64 application image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jpackageArgs = @(
            '--verbose',
            '--type', 'app-image',
            '--runtime-image', 'runtime',
            '--input', 'target/libs',
            '--module-path', 'target/mods',
            '--module', 'org.cryptomator.desktop/org.cryptomator.launcher.Cryptomator',
            '--dest', 'appdir',
            '--name', 'Cryptomator',
            '--vendor', 'Skymatic GmbH',
            '--copyright', '(C) 2016 - 2026 Skymatic GmbH',
            '--app-version', "$env:PACKAGE_VERSION",
            '--java-options', '--enable-preview',
            '--java-options', '--enable-native-access=javafx.graphics,org.cryptomator.jfuse.win,org.cryptomator.integrations.win',
            '--java-options', '-Xss5m',
            '--java-options', '-Xmx256m',
            '--java-options', "-Dcryptomator.appVersion=$env:APP_VERSION",
            '--java-options', '-Dfile.encoding=utf-8',
            '--java-options', '-Djava.net.useSystemProxies=true',
            '--java-options', '-Dcryptomator.adminConfigPath=C:/ProgramData/Cryptomator/config.properties',
            '--java-options', '-Dcryptomator.logDir=@{localappdata}/Cryptomator',
            '--java-options', '-Dcryptomator.settingsPath=@{appdata}/Cryptomator/settings.json;@{userhome}/AppData/Roaming/Cryptomator/settings.json',
            '--java-options', '-Dcryptomator.p12Path=@{appdata}/Cryptomator/key.p12;@{userhome}/AppData/Roaming/Cryptomator/key.p12',
            '--java-options', '-Dcryptomator.ipcSocketPath=@{localappdata}/Cryptomator/ipc.socket',
            '--java-options', '-Dcryptomator.mountPointsDir=@{userhome}/Cryptomator',
            '--java-options', '-Dcryptomator.loopbackAlias=cryptomator-vault',
            '--java-options', '-Dcryptomator.showTrayIcon=true',
            '--java-options', "-Dcryptomator.buildNumber=windows-arm64-$env:GITHUB_RUN_NUMBER",
            '--java-options', '-Dcryptomator.integrationsWin.autoStartShellLinkName=Cryptomator',
            '--java-options', '-Dcryptomator.integrationsWin.keychainPaths=@{appdata}/Cryptomator/keychain.json;@{userhome}/AppData/Roaming/Cryptomator/keychain.json',
            '--java-options', '-Dcryptomator.integrationsWin.windowsHelloKeychainPaths=@{appdata}/Cryptomator/windowsHelloKeychain.json',
            '--java-options', '-Dcryptomator.disableUpdateCheck=true',
            '--java-options', '-XX:ErrorFile=@{localappdata}/Cryptomator/cryptomator_crash.log',
            '--java-options', '-Dcryptomator.hub.enableTrustOnFirstUse=true',
            '--resource-dir', 'dist/win/resources',
            '--icon', 'dist/win/resources/Cryptomator.ico',
            '--add-launcher', 'Cryptomator (Debug)=dist/win/debug-launcher.properties'
          )
          & "$env:JAVA_HOME\bin\jpackage.exe" @jpackageArgs
          if ($LASTEXITCODE -ne 0) { throw 'jpackage failed.' }

          # The upstream contrib copy contains an x64-only legacy jnidispatch.dll.
          # The current app no longer needs that loose DLL, so keep it out of the ARM64 image.
          Get-ChildItem -LiteralPath dist\win\contrib -File |
            Where-Object Name -NE 'jnidispatch.dll' |
            Copy-Item -Destination appdir\Cryptomator

          @"
          Cryptomator Windows ARM64 downstream preview

          This is an unofficial, unsigned ARM64 build from:
          https://github.com/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA

          Optional: Install WinFsp 2.1 or newer to use the WinFsp volume type:
          https://github.com/winfsp/winfsp/releases

          Start Cryptomator.exe from this directory. Automatic in-app updates are
          disabled because official updates currently provide x64 Windows packages.
          Windows Hello support is enabled. If Windows Hello is not configured for
          the current user, Cryptomator safely falls back to Windows Data Protection.
          "@ | Set-Content -LiteralPath appdir\Cryptomator\README-WINDOWS-ARM64.txt -Encoding utf8

      - name: Verify native binaries and ARM64 integration resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-PeMachine([string] $Path) {
            $stream = [IO.File]::OpenRead($Path)
            try {
              $reader = [IO.BinaryReader]::new($stream)
              $stream.Position = 0x3c
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) {
                throw "Not a PE file: $Path"
              }
              return $reader.ReadUInt16()
            } finally {
              $stream.Dispose()
            }
          }

          $arm64 = 0xAA64
          $files = @(
            'appdir\Cryptomator\Cryptomator.exe',
            'appdir\Cryptomator\Cryptomator (Debug).exe'
          )
          foreach ($name in @('jvm.dll', 'glass.dll', 'prism_d3d.dll')) {
            $match = Get-ChildItem -LiteralPath appdir\Cryptomator\runtime -Recurse -File -Filter $name |
              Select-Object -First 1
            if ($null -eq $match) { throw "Missing runtime binary: $name" }
            $files += $match.FullName
          }

          foreach ($file in $files) {
            $machine = Get-PeMachine $file
            if ($machine -ne $arm64) {
              throw ('Expected ARM64 PE machine 0xAA64 for {0}; got 0x{1:X4}.' -f $file, $machine)
            }
            Write-Host ('Verified ARM64: {0}' -f $file)
          }

          if (Test-Path -LiteralPath appdir\Cryptomator\jnidispatch.dll) {
            throw 'The x64-only loose jnidispatch.dll must not be present in the ARM64 image.'
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $integrationJar = Get-ChildItem -LiteralPath appdir\Cryptomator\app\mods -Filter 'integrations-win-*.jar' |
            Select-Object -First 1
          if ($null -eq $integrationJar) { throw 'integrations-win module is missing.' }
          $archive = [IO.Compression.ZipFile]::OpenRead($integrationJar.FullName)
          try {
            $entry = $archive.GetEntry('integrations-arm64.dll')
            if ($null -eq $entry) {
              throw 'integrations-win does not contain integrations-arm64.dll.'
            }
            $patchedIntegration = Join-Path $env:RUNNER_TEMP 'cryptomator-integrations-arm64.dll'
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $patchedIntegration, $true)
          } finally {
            $archive.Dispose()
          }

          $machine = Get-PeMachine $patchedIntegration
          if ($machine -ne $arm64) {
            throw ('Expected ARM64 PE machine 0xAA64 for the Windows integration; got 0x{0:X4}.' -f $machine)
          }
          Write-Host 'Verified patched Windows Hello integration is ARM64.'

      - name: Launch smoke test on Windows ARM64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path 'appdir\Cryptomator\Cryptomator (Debug).exe'
          $process = Start-Process -FilePath $exe -WorkingDirectory 'appdir\Cryptomator' `
            -RedirectStandardOutput smoke.stdout.txt -RedirectStandardError smoke.stderr.txt -PassThru
          try {
            Start-Sleep -Seconds 20
            $process.Refresh()
            if ($process.HasExited) {
              Write-Host '--- stdout ---'
              if (Test-Path smoke.stdout.txt) { Get-Content smoke.stdout.txt }
              Write-Host '--- stderr ---'
              if (Test-Path smoke.stderr.txt) { Get-Content smoke.stderr.txt }
              Get-ChildItem -LiteralPath appdir\Cryptomator -Filter 'hs_err_pid*.log' -ErrorAction SilentlyContinue |
                ForEach-Object {
                  Write-Host "--- $($_.Name) ---"
                  Get-Content -LiteralPath $_.FullName
                }
              throw "Cryptomator exited during the ARM64 smoke test with code $($process.ExitCode)."
            }
            Write-Host 'Cryptomator remained running for 20 seconds on the native ARM64 runner.'
          } finally {
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F
            }
          }

          $launcherConfigs = Get-ChildItem -LiteralPath appdir\Cryptomator\app -Filter '*.cfg'
          if ($launcherConfigs | Select-String -SimpleMatch 'cryptomator.keychain.disabledProviders') {
            throw 'The packaged launcher still disables a keychain provider.'
          }

      - name: Package portable release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -LiteralPath appdir\Cryptomator -DestinationPath "$env:ASSET_NAME" -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath "$env:ASSET_NAME" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:ASSET_NAME" | Set-Content -LiteralPath "$env:ASSET_NAME.sha256" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cryptomator-windows-arm64
          path: |
            ${{ env.ASSET_NAME }}
            ${{ env.ASSET_NAME }}.sha256
          if-no-files-found: error

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          @"
          Unofficial Windows ARM64 preview built entirely on GitHub's native Windows ARM64 runner.

          Source commit: https://github.com/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA

          Validation performed by this workflow:

          - ARM64 JDK and JavaFX module checks
          - Maven packaging with the repository's Maven Wrapper
          - PE machine checks for the launchers, JVM, and JavaFX runtime
          - compilation and PE verification of the patched ARM64 Windows integration
          - a 20-second native launch smoke test with the Windows Hello provider enabled

          Windows Hello support is enabled. The native availability check first uses
          Windows' consent-device capability API, allowing machines without a configured
          Hello keyset to fall back safely to Windows Data Protection. GitHub's hosted
          runner cannot perform an interactive biometric or PIN authentication, so the
          end-to-end Hello prompt must be exercised on a real Windows ARM64 device.

          This downstream build is unsigned, so Windows may show a SmartScreen warning.
          Extract the ZIP and run `Cryptomator.exe`. WinFsp 2.1 or newer is optional
          and available from https://github.com/winfsp/winfsp/releases.

          Automatic in-app updates are disabled to prevent replacement by an official
          x64 Windows package.
          "@ | Set-Content -LiteralPath release-notes.md -Encoding utf8

          & gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload "$env:RELEASE_TAG" "$env:ASSET_NAME" "$env:ASSET_NAME.sha256" `
              --clobber --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to update the existing ARM64 release.' }
          } else {
            & gh release create "$env:RELEASE_TAG" "$env:ASSET_NAME" "$env:ASSET_NAME.sha256" `
              --target "$env:GITHUB_SHA" `
              --title "Cryptomator $env:APP_VERSION for Windows ARM64" `
              --notes-file release-notes.md `
              --prerelease `
              --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create the ARM64 release.' }
          }
